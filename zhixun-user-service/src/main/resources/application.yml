server:
  port: ${USER_SERVICE_PORT:8081}

spring:
  application:
    name: zhixun-user-service
  config:
    import:
      - "optional:nacos:${spring.application.name}.yml?group=DEFAULT_GROUP&refreshEnabled=true"
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:zhixun_campus}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
    username: ${MYSQL_USERNAME:root}
    password: "${MYSQL_PASSWORD:}"
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: "${REDIS_PASSWORD:}"
      database: ${REDIS_DATABASE:0}
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        server-addr: ${spring.cloud.nacos.server-addr}
      config:
        server-addr: ${spring.cloud.nacos.server-addr}
        file-extension: yml

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.zhixun.user.domain
  configuration:
    map-underscore-to-camel-case: true

zhixun:
  security:
    jwt:
      issuer: zhixun-campus
      secret: ${JWT_SECRET:zhixun-campus-development-secret-change-before-production-2026}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:2h}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
