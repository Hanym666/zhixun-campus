server:
  port: ${AI_SERVICE_PORT:8083}

spring:
  application:
    name: zhixun-ai-service
  data:
    redis:
      host: ${REDIS_STACK_HOST:127.0.0.1}
      port: ${REDIS_STACK_PORT:6380}
      password: "${REDIS_STACK_PASSWORD:}"
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:qwen2.5:1.5b}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    vectorstore:
      redis:
        index-name: ${REDIS_VECTOR_INDEX:zhixun-item-vector-v1}
        prefix: "${REDIS_VECTOR_PREFIX:zhixun:document:}"
        initialize-schema: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
